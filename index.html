<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New Tab</title>

  <style>
    :root {
      color-scheme: dark;
      --bg-color: #121212;
      --text-color: #e0e0e0;
      --panel-color: #1e1e1e;
      --accent-color: #3b82f6;
      --tab-inactive: #2a2a2a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg-color);
      color: var(--text-color);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    .tab-bar {
      display: flex;
      align-items: flex-end;
      gap: 5px;
      padding: 5px 10px 0;
      overflow-x: auto;
      background: #0a0a0a;
      border-bottom: 2px solid var(--panel-color);
    }

    .tab {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 100px;
      max-width: 170px;
      padding: 8px 12px;
      overflow: hidden;
      border: 1px solid transparent;
      border-bottom: 0;
      border-radius: 8px 8px 0 0;
      background: var(--tab-inactive);
      color: #aaa;
      cursor: pointer;
      white-space: nowrap;
    }

    .tab.active {
      border-color: #333;
      background: var(--panel-color);
      color: var(--text-color);
      font-weight: bold;
    }

    .tab-title {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .close-btn,
    .new-tab-btn {
      border: 0;
      color: #aaa;
      cursor: pointer;
    }

    .close-btn {
      flex: 0 0 auto;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: transparent;
    }

    .close-btn:hover {
      background: #ff4d4d;
      color: white;
    }

    .new-tab-btn {
      margin-bottom: 5px;
      padding: 0 10px;
      background: transparent;
      font-size: 20px;
    }

    .new-tab-btn:hover {
      color: white;
    }

    .window-content {
      position: relative;
      flex: 1;
      min-height: 0;
      background: var(--panel-color);
    }

    .tab-panel {
      position: absolute;
      inset: 0;
      display: none;
      overflow: auto;
      padding: 30px;
    }

    .tab-panel.active {
      display: block;
    }

    .search-container {
      max-width: 700px;
      margin: 50px auto 20px;
      text-align: center;
    }

    .search-title {
      margin-bottom: 20px;
      color: white;
      font-size: 32px;
      font-weight: 600;
    }

    .search-form {
      display: flex;
      overflow: hidden;
      border: 1px solid #333;
      border-radius: 24px;
      box-shadow: 0 4px 12px rgb(0 0 0 / 50%);
    }

    .search-input {
      flex: 1;
      min-width: 0;
      padding: 14px 20px;
      border: 0;
      outline: none;
      background: #252525;
      color: white;
    }

    .search-btn,
    .mode-btn {
      padding: 10px 18px;
      border: 0;
      background: var(--accent-color);
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    .search-btn:hover,
    .mode-btn:hover {
      background: #2563eb;
    }

    .search-modes {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 12px;
    }

    .mode-btn {
      border-radius: 6px;
      background: #333;
    }

    .mode-btn[aria-pressed="true"] {
      background: var(--accent-color);
    }

    .status {
      min-height: 1.5em;
      margin: 20px 0 0;
      color: #aaa;
      text-align: center;
    }

    .results-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 20px;
      margin-top: 25px;
    }

    .media-card {
      overflow: hidden;
      border: 1px solid #333;
      border-radius: 8px;
      background: #252525;
      box-shadow: 0 2px 8px rgb(0 0 0 / 20%);
    }

    .result-button {
      display: block;
      width: 100%;
      padding: 0;
      border: 0;
      background: transparent;
      color: inherit;
      cursor: pointer;
      text-align: left;
    }

    .result-button:hover .media-title {
      color: #93c5fd;
    }

    .media-thumb {
      display: flex;
      width: 100%;
      height: 160px;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #151515;
      color: #888;
    }

    .media-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .media-info {
      padding: 12px;
    }

    .media-title {
      margin-bottom: 5px;
      color: white;
      font-size: 14px;
      font-weight: bold;
    }

    .media-desc {
      color: #aaa;
      font-size: 12px;
      line-height: 1.4;
    }

    .frame-panel {
      padding: 0;
      overflow: hidden;
      background: #000;
    }

    .embedded-frame {
      width: 100%;
      height: 100%;
      border: 0;
      background: #000;
    }

    .media-viewer {
      display: flex;
      width: 100%;
      height: 100%;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    .media-viewer img,
    .media-viewer video {
      max-width: 100%;
      max-height: 100%;
    }

    @media (max-width: 600px) {
      .tab-panel {
        padding: 18px;
      }

      .search-container {
        margin-top: 25px;
      }

      .search-title {
        font-size: 26px;
      }

      .search-form {
        flex-wrap: wrap;
        border-radius: 14px;
      }

      .search-input {
        flex-basis: 100%;
      }

      .search-btn {
        width: 100%;
        padding: 12px;
      }
    }
  </style>
</head>

<body>
  <nav class="tab-bar" id="tabBar" aria-label="App tabs">
    <button class="new-tab-btn" id="newTabButton" type="button" aria-label="Open a new tab">+</button>
  </nav>

  <main class="window-content" id="windowContent"></main>

  <script>
    "use strict";

    let tabCount = 0;
    const tabsData = new Map();
    const tabBar = document.getElementById("tabBar");
    const windowContent = document.getElementById("windowContent");
    const newTabButton = document.getElementById("newTabButton");

    newTabButton.addEventListener("click", () => createHomeTab());
    createHomeTab();

    function createTab(type, content) {
      const id = `tab_${++tabCount}`;

      const tab = document.createElement("div");
      tab.className = "tab";
      tab.id = `trigger_${id}`;
      tab.setAttribute("role", "button");
      tab.setAttribute("tabindex", "0");
      tab.setAttribute("aria-label", "New Tab");

      const title = document.createElement("span");
      title.className = "tab-title";
      title.textContent = "New Tab";

      const closeButton = document.createElement("button");
      closeButton.className = "close-btn";
      closeButton.type = "button";
      closeButton.textContent = "×";
      closeButton.setAttribute("aria-label", "Close tab");

      tab.append(title, closeButton);
      tabBar.insertBefore(tab, newTabButton);

      const panel = document.createElement("section");
      panel.className = "tab-panel";
      panel.id = `panel_${id}`;
      panel.setAttribute("aria-label", "New Tab content");
      panel.append(content);
      windowContent.append(panel);

      tab.addEventListener("click", (event) => {
        if (event.target !== closeButton) {
          switchTab(id);
        }
      });

      tab.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          switchTab(id);
        }
      });

      closeButton.addEventListener("click", (event) => {
        event.stopPropagation();
        closeTab(id);
      });

      tabsData.set(id, { type });
      switchTab(id);
      return id;
    }

    function createHomeTab() {
      const content = document.createElement("div");

      const searchContainer = document.createElement("div");
      searchContainer.className = "search-container";

      const heading = document.createElement("h1");
      heading.className = "search-title";
      heading.textContent = "New Tab";

      const form = document.createElement("form");
      form.className = "search-form";

      const input = document.createElement("input");
      input.className = "search-input";
      input.type = "search";
      input.placeholder = "Search Wikipedia or enter a website URL";
      input.setAttribute("aria-label", "Search or enter a website URL");
      input.autocomplete = "off";

      const searchButton = document.createElement("button");
      searchButton.className = "search-btn";
      searchButton.type = "submit";
      searchButton.textContent = "Search";

      form.append(input, searchButton);

      const modes = document.createElement("div");
      modes.className = "search-modes";
      modes.setAttribute("aria-label", "Search type");

      const status = document.createElement("p");
      status.className = "status";
      status.setAttribute("aria-live", "polite");

      const grid = document.createElement("div");
      grid.className = "results-grid";

      const modeButtons = new Map();
      let mode = "web";

      for (const [value, label] of [
        ["web", "Articles"],
        ["images", "Images"],
        ["videos", "Videos"]
      ]) {
        const button = document.createElement("button");
        button.className = "mode-btn";
        button.type = "button";
        button.textContent = label;
        button.setAttribute("aria-pressed", String(value === mode));
        button.addEventListener("click", () => {
          mode = value;
          for (const [buttonMode, modeButton] of modeButtons) {
            modeButton.setAttribute("aria-pressed", String(buttonMode === mode));
          }
          input.focus();
        });
        modeButtons.set(value, button);
        modes.append(button);
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        search(input.value, mode, grid, status);
      });

      searchContainer.append(heading, form, modes);
      content.append(searchContainer, status, grid);
      createTab("home", content);
    }

    function switchTab(id) {
      document.querySelectorAll(".tab").forEach((tab) => {
        tab.classList.toggle("active", tab.id === `trigger_${id}`);
      });

      document.querySelectorAll(".tab-panel").forEach((panel) => {
        panel.classList.toggle("active", panel.id === `panel_${id}`);
      });
    }

    function closeTab(id) {
      document.getElementById(`trigger_${id}`)?.remove();
      document.getElementById(`panel_${id}`)?.remove();
      tabsData.delete(id);

      const remainingIds = Array.from(tabsData.keys());
      if (remainingIds.length) {
        switchTab(remainingIds[remainingIds.length - 1]);
      } else {
        createHomeTab();
      }
    }

    function isWebsiteAddress(value) {
      return /^https?:\/\//i.test(value) ||
        /^(?:www\.)[^\s]+\.[^\s]+$/i.test(value);
    }

    function normalizeWebsiteAddress(value) {
      const address = /^https?:\/\//i.test(value) ? value : `https://${value}`;
      const url = new URL(address);

      if (url.protocol !== "http:" && url.protocol !== "https:") {
        throw new Error("Only HTTP and HTTPS website addresses are supported.");
      }

      return url.href;
    }

    async function search(rawQuery, mode, grid, status) {
      const query = rawQuery.trim();
      if (!query) {
        status.textContent = "Enter a search term or website address.";
        return;
      }

      grid.replaceChildren();

      if (isWebsiteAddress(query)) {
        try {
          openWebsite(normalizeWebsiteAddress(query));
          status.textContent = "Opening the website inside a new app tab. Some sites block embedding.";
        } catch (error) {
          status.textContent = error.message;
        }
        return;
      }

      status.textContent = "Searching…";

      try {
        if (mode === "web") {
          await searchArticles(query, grid);
        } else {
          await searchCommons(query, mode, grid);
        }

        status.textContent = grid.childElementCount
          ? ""
          : "No results were found.";
      } catch (error) {
        status.textContent = `Search failed: ${error.message}`;
      }
    }

    async function fetchJson(url) {
      const response = await fetch(url, {
        headers: { Accept: "application/json" },
        referrerPolicy: "no-referrer"
      });

      if (!response.ok) {
        throw new Error(`The search service returned HTTP ${response.status}.`);
      }

      return response.json();
    }

    async function searchArticles(query, grid) {
      const params = new URLSearchParams({
        action: "query",
        list: "search",
        srsearch: query,
        srlimit: "20",
        format: "json",
        origin: "*"
      });

      const data = await fetchJson(
        `https://en.wikipedia.org/w/api.php?${params.toString()}`
      );

      const results = data?.query?.search ?? [];
      for (const result of results) {
        const card = document.createElement("article");
        card.className = "media-card";

        const button = document.createElement("button");
        button.className = "result-button";
        button.type = "button";

        const thumbnail = document.createElement("div");
        thumbnail.className = "media-thumb";
        thumbnail.textContent = "📄";

        const info = document.createElement("div");
        info.className = "media-info";

        const title = document.createElement("div");
        title.className = "media-title";
        title.textContent = result.title;

        const description = document.createElement("div");
        description.className = "media-desc";
        description.textContent = stripHtml(result.snippet);

        info.append(title, description);
        button.append(thumbnail, info);
        button.addEventListener("click", () => {
          const pageUrl = `https://en.wikipedia.org/wiki/${encodeURIComponent(
            result.title.replaceAll(" ", "_")
          )}`;
          openWebsite(pageUrl);
        });

        card.append(button);
        grid.append(card);
      }
    }

    async function searchCommons(query, mode, grid) {
      const params = new URLSearchParams({
        action: "query",
        generator: "search",
        gsrsearch: query,
        gsrnamespace: "6",
        gsrlimit: "30",
        prop: "imageinfo",
        iiprop: "url|mime",
        iiurlwidth: "480",
        format: "json",
        origin: "*"
      });

      const data = await fetchJson(
        `https://commons.wikimedia.org/w/api.php?${params.toString()}`
      );

      const pages = Object.values(data?.query?.pages ?? {});
      const matchingPages = pages.filter((page) => {
        const info = page.imageinfo?.[0];
        if (!info) return false;

        const isVideo = info.mime?.startsWith("video/");
        return mode === "videos" ? isVideo : !isVideo;
      });

      for (const page of matchingPages) {
        const info = page.imageinfo[0];
        const fileUrl = info.thumburl || info.url;
        if (!fileUrl) continue;

        const card = document.createElement("article");
        card.className = "media-card";

        const button = document.createElement("button");
        button.className = "result-button";
        button.type = "button";

        const thumbnail = document.createElement("div");
        thumbnail.className = "media-thumb";

        if (!info.mime?.startsWith("video/")) {
          const image = document.createElement("img");
          image.src = info.thumburl || info.url;
          image.alt = page.title;
          image.loading = "lazy";
          thumbnail.append(image);
        } else {
          thumbnail.textContent = "▶ Video";
        }

        const infoBox = document.createElement("div");
        infoBox.className = "media-info";

        const title = document.createElement("div");
        title.className = "media-title";
        title.textContent = page.title.replace(/^File:/, "");

        const description = document.createElement("div");
        description.className = "media-desc";
        description.textContent = info.mime || "Wikimedia Commons media";

        infoBox.append(title, description);
        button.append(thumbnail, infoBox);
        button.addEventListener("click", () => {
          if (info.mime?.startsWith("video/")) {
            openVideo(fileUrl);
          } else {
            openImage(info.url || fileUrl, page.title);
          }
        });

        card.append(button);
        grid.append(card);
      }
    }

    function stripHtml(value) {
      const parsed = new DOMParser().parseFromString(value || "", "text/html");
      return parsed.body.textContent || "";
    }

    function openWebsite(address) {
      const frame = document.createElement("iframe");
      frame.className = "embedded-frame";
      frame.title = "Website content";
      frame.src = address;
      frame.loading = "lazy";
      frame.referrerPolicy = "no-referrer";

      // The sandbox prevents the embedded site from navigating the app's top window.
      frame.sandbox = "allow-forms allow-scripts allow-same-origin";

      const content = document.createElement("div");
      content.className = "frame-panel";
      content.append(frame);
      createTab("website", content);
    }

    function openImage(address, titleText) {
      const content = document.createElement("div");
      content.className = "media-viewer";

      const image = document.createElement("img");
      image.src = address;
      image.alt = titleText;
      image.referrerPolicy = "no-referrer";

      content.append(image);
      createTab("image", content);
    }

    function openVideo(address) {
      const content = document.createElement("div");
      content.className = "media-viewer";

      const video = document.createElement("video");
      video.src = address;
      video.controls = true;
      video.autoplay = false;
      video.playsInline = true;
      video.preload = "metadata";

      content.append(video);
      createTab("video", content);
    }
  </script>
</body>
</html>
